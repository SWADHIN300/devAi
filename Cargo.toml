[package]
name = "devpilot"
version = "0.1.0"
edition = "2024"
description = "A local-first CLI foundation for the DevPilot AI coding agent"
license = "MIT"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
keyring = "3.6"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
serde_json = "1"
url = "2"
webbrowser = "1"

[[bin]]
name = "devpilot"
path = "src/main.rs"
